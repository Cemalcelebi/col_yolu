# Gunluk COL taramasi — BASLAT.py + gun() GitHub'in bulutunda, Colab'a basmadan.
# Zaman: is gunleri 19:35 TR (16:35 UTC). BIST 18:00'de kapanir, Yahoo verisi ~18:30'da tamamlanir.
# Elle calistirmak: GitHub > col_yolu > Actions > "Gunluk Col Taramasi" > Run workflow.
name: Gunluk Col Taramasi

on:
  schedule:
    - cron: "35 16 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gunluk-tarama
  cancel-in-progress: false

jobs:
  tara:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-gh.txt

      - name: Paketleri kur
        run: pip install -r requirements-gh.txt

      - name: Veri onbellegini geri yukle
        uses: actions/cache/restore@v4
        with:
          path: veri_1d_turkey.pkl
          key: veri-1d-turkey-${{ github.run_id }}
          restore-keys: veri-1d-turkey-

      - name: Drive yolunu taklit et
        run: |
          sudo mkdir -p /content/drive/MyDrive
          sudo ln -sfn "$GITHUB_WORKSPACE" /content/drive/MyDrive/col_tarayici
          ls -la /content/drive/MyDrive/

      - name: Tarama
        id: tarama
        run: python -u gh_gunluk.py

      - name: Veri onbellegini sakla
        if: always() && hashFiles('veri_1d_turkey.pkl') != ''
        uses: actions/cache/save@v4
        with:
          path: veri_1d_turkey.pkl
          key: veri-1d-turkey-${{ github.run_id }}

      - name: Sonucu repoya kaydet
        if: always()
        run: |
          git config user.name "col-yolu-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in rapor takip_adaylar.csv takip_pozisyonlar.csv takip_kapanan.csv takip_log.txt veri_koru_gunluk.csv; do
            [ -e "$f" ] && git add -f "$f"
          done
          if git diff --cached --quiet; then echo "Degisiklik yok"; exit 0; fi
          git commit -m "Gunluk tarama $(TZ=Europe/Istanbul date +%F)"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          echo "Push basarisiz"; exit 1
